# 链式代理示例:落地节点通过 dialer-proxy 走「中转」组,中转组的节点来自订阅
tpl: &tpl
  type: http
  interval: 86400
port: 7890
proxies:
  - {name: "落地 A", type: ss, server: land-a.example.com, port: 8388, cipher: aes-128-gcm, password: p, dialer-proxy: 中转}
  - {name: "落地 B", type: trojan, server: land-b.example.com, port: 443, password: p, dialer-proxy: 中转}
proxy-providers:
  Air:
    type: http
    url: "https://example.com/sub"
proxy-groups:
  - {name: 手动选择, type: select, use: [Air], proxies: [中转, 落地, DIRECT]}
  - {name: 中转, type: select, use: [Air]}
  - {name: 落地, type: select, proxies: ["落地 A", "落地 B"]}
  - name: 	Telegram
    type: select
    use: [Air]
    proxies: [手动选择, 落地]
rule-providers:
  cn: {<<: *tpl, behavior: domain, url: "https://example.com/cn.mrs"}
rules:
  - RULE-SET,cn,DIRECT
  - MATCH,手动选择
