mixed-port: 7890
mode: rule
dns:
  enable: true
  nameserver: [223.5.5.5]
proxies:
  - {name: "香港 01", type: ss, server: hk1.example.com, port: 8388, cipher: aes-128-gcm, password: p}
  - {name: "香港 02", type: ss, server: hk2.example.com, port: 8388, cipher: aes-128-gcm, password: p}
  - {name: "日本 01", type: trojan, server: jp1.example.com, port: 443, password: p}
  - {name: "美国 01", type: vmess, server: us1.example.com, port: 443, uuid: 11111111-1111-1111-1111-111111111111, alterId: 0, cipher: auto}
  - {name: "Premium A", type: ss, server: a.example.com, port: 8388, cipher: aes-128-gcm, password: p}
proxy-groups:
  - {name: 节点选择, type: select, proxies: [自动选择, 香港, 日本, DIRECT, "香港 01", "香港 02", "日本 01", "美国 01", "Premium A"]}
  - {name: 自动选择, type: url-test, url: "https://www.gstatic.com/generate_204", interval: 300, proxies: ["香港 01", "香港 02", "日本 01", "美国 01", "Premium A"]}
  - {name: 香港, type: select, proxies: ["香港 01", "香港 02"]}
  - {name: 日本, type: select, proxies: ["日本 01"]}
  - {name: 精选, type: select, proxies: ["香港 01", "Premium A"]}
  - {name: 流媒体, type: select, include-all: true, filter: "(?i)美|US"}
  - {name: 广告拦截, type: select, proxies: [REJECT, DIRECT]}
rules:
  - DOMAIN-SUFFIX,google.com,节点选择
  - GEOIP,CN,DIRECT
  - MATCH,节点选择
